services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rosterduel
      POSTGRES_PASSWORD: rosterduel
      POSTGRES_DB: rosterduel
    ports:
      - "5432:5432"
    volumes:
      - rosterduel_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  rosterduel_postgres_data:
